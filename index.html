<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1769e0">
<title>FIVE STAR TV</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f7ff;color:#17243a;font-family:Arial,sans-serif}
header{background:#1769e0;color:white;padding:20px;text-align:center}
header h1{margin:0;font-size:25px;letter-spacing:1px}
header p{margin:7px 0 0;font-size:13px}
main{max-width:850px;margin:28px auto;padding:16px}
.panel{background:white;border-radius:14px;padding:22px;box-shadow:0 4px 18px #173d7012;margin-bottom:18px}
h2{font-size:19px;margin:0 0 15px;color:#1769e0}
input{width:100%;padding:14px;border:1px solid #ccd8e8;border-radius:9px;font-size:16px;margin:5px 0 12px}
button{width:100%;padding:14px;border:0;border-radius:9px;background:#1769e0;color:white;font-size:16px;font-weight:bold}
button:disabled{opacity:.6}
#message{font-size:14px;margin-top:12px;color:#d33}
#player{width:100%;aspect-ratio:16/9;background:#101827;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#dce8ff;text-align:center;padding:15px}
#videoList{display:grid;gap:10px}
.video-item{padding:14px;border:1px solid #e1e9f5;border-radius:9px;background:#fff}
.small{font-size:13px;color:#718096}
footer{text-align:center;color:#718096;font-size:12px;padding:20px}
</style>
</head>
<body>
<header>
<h1>FIVE STAR TV</h1>
<p>သင့်အတွက် ဖျော်ဖြေရေးကမ္ဘာ</p>
</header>

<main>
<section class="panel" id="loginPanel">
<h2>အသင်းဝင် Login</h2>
<p class="small">Admin ထံမှ ရရှိထားသော Access Code ကို ထည့်သွင်းပါ။</p>
<input id="accessCode" type="password" placeholder="Access Code ထည့်ပါ" autocomplete="off">
<button id="loginButton" type="button">ဝင်ရောက်မည်</button>
<div id="message"></div>
</section>

<section class="panel" id="viewerPanel" hidden>
<h2>FIVE STAR TV အသင်းဝင်အချက်အလက်</h2>
<div class="video-item">
<p>Package သက်တမ်း: <strong id="planMonths">-</strong></p>
<p>စတင်ကြည့်ရှုသည့်နေ့: <strong id="activatedDate">-</strong></p>
<p>ကုန်ဆုံးမည့်ရက်: <strong id="expiresDate">-</strong></p>
<p>ကျန်ရှိသည့်ရက်: <strong id="remainingDays">-</strong></p>
</div>
<h2 style="margin-top:20px">ဗီဒီယိုကြည့်ရှုရန်</h2>
<div id="player">ဗီဒီယိုကို ရွေးချယ်ပါ</div>
<div id="videoList" style="margin-top:16px"></div>
</section>
</main>

<footer>FIVE STAR TV<p></p></footer>

<script>
const SUPABASE_URL = "https://ojmwlnwcbesezvxuryjc.supabase.co";
const SUPABASE_KEY = "sb_publishable_HdpdY2jPa_-Q1eDUq407JQ_HI7eC9qC";
const TOKEN_KEY = "fiveStarSessionToken";
const message = document.getElementById("message");
const loginPanel = document.getElementById("loginPanel");
const viewerPanel = document.getElementById("viewerPanel");
const loginButton = document.getElementById("loginButton");

let deviceId = localStorage.getItem("fiveStarDeviceId");
if (!deviceId) {
  deviceId = crypto.randomUUID();
  localStorage.setItem("fiveStarDeviceId", deviceId);
}

const dateFormat = new Intl.DateTimeFormat("my-MM", {
  year: "numeric", month: "long", day: "numeric"
});

function showMember(data) {
  document.getElementById("planMonths").textContent = data.plan_months + " လ";
  document.getElementById("activatedDate").textContent = dateFormat.format(new Date(data.activated_at));
  document.getElementById("expiresDate").textContent = dateFormat.format(new Date(data.expires_at));
  document.getElementById("remainingDays").textContent = data.remaining_days + " ရက်";
  loginPanel.hidden = true;
  viewerPanel.hidden = false;
}

async function verifyStoredSession() {
  const token = localStorage.getItem(TOKEN_KEY);
  if (!token) return;

  message.textContent = "အသင်းဝင်အခြေအနေ စစ်ဆေးနေပါသည်။";
  try {
    const response = await fetch(SUPABASE_URL + "/functions/v1/verify-session", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_KEY
      },
      body: JSON.stringify({ token, deviceId })
    });
    const result = await response.json();

    if (response.ok && result.valid === true) {
      showMember(result);
      return;
    }

    if (response.status === 401 || response.status === 403) {
      localStorage.removeItem(TOKEN_KEY);
      message.textContent = "Session သက်တမ်းကုန်ပါပြီ။ Access Code အသစ်ထည့်ပါ။";
      return;
    }

    message.textContent = result.error || "Session စစ်ဆေး၍ မရပါ။ အင်တာနက်ပြန်စစ်ပါ။";
  } catch (error) {
    message.textContent = "ချိတ်ဆက်မှု မအောင်မြင်ပါ။ အင်တာနက်ပြန်စစ်ပါ။";
  }
}

loginButton.addEventListener("click", async () => {
  const code = document.getElementById("accessCode").value.trim();
  if (!code) {
    message.textContent = "Access Code ထည့်ပေးပါ။";
    return;
  }

  message.textContent = "စစ်ဆေးနေပါသည်။";
  loginButton.disabled = true;

  try {
    const response = await fetch(SUPABASE_URL + "/functions/v1/activate-code", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_KEY
      },
      body: JSON.stringify({ code, deviceId })
    });
    const result = await response.json();

    if (!response.ok) throw new Error(result.error || "ဝင်ရောက်၍ မရပါ။");

    if (!result.session_token || !result.activated_at || !result.expires_at) {
      throw new Error("Session သို့မဟုတ် သက်တမ်းအချက်အလက် မရရှိပါ။");
    }

    localStorage.setItem(TOKEN_KEY, result.session_token);
    message.textContent = "ဝင်ရောက်မှု အောင်မြင်ပါသည်။";
    showMember(result);
  } catch (error) {
    message.textContent = error.message || "ချိတ်ဆက်မှု မအောင်မြင်ပါ။";
  } finally {
    loginButton.disabled = false;
  }
});

verifyStoredSession();
</script>
</body>
</html>
